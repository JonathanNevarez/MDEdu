name: mdedu-app
services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-adaptativa}
      POSTGRES_USER: ${DB_USER:-adaptativa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 384m
  backend:
    image: mdedu-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: database
      DB_NAME: ${DB_NAME:-adaptativa}
      DB_USER: ${DB_USER:-adaptativa}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
      META_UI_USERNAME: ${META_UI_USERNAME:?Configure META_UI_USERNAME}
      META_UI_PASSWORD: ${META_UI_PASSWORD:?Configure META_UI_PASSWORD}
      LLM_PROVIDER: ${LLM_PROVIDER:-DISABLED}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-3000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      LLM_RATE_LIMIT_REQUESTS: ${LLM_RATE_LIMIT_REQUESTS:-60}
      LLM_RATE_LIMIT_WINDOW_SECONDS: ${LLM_RATE_LIMIT_WINDOW_SECONDS:-60}
      LLM_RATE_LIMIT_GLOBAL_REQUESTS: ${LLM_RATE_LIMIT_GLOBAL_REQUESTS:-600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8088}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    depends_on:
      database:
        condition: service_healthy
    mem_limit: 768m
  frontend:
    image: mdedu-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
volumes:
  app_postgres_data:
