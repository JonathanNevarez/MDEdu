# Additive single-origin deployment; always activate together with prod.
spring.config.import=
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
app.spa.enabled=true
# Render supplies RENDER_EXTERNAL_URL. Local production smoke supplies its exact origin.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${RENDER_EXTERNAL_URL}}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=4000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.initialization-fail-timeout=60000
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=2
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
