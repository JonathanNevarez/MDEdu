spring.application.name=adaptativa-backend
# Ejecutar Maven/JAR desde backend/. Las variables del proceso tienen prioridad.
spring.config.import=optional:file:../.env[.properties]

server.address=${BACKEND_ADDRESS:127.0.0.1}
server.port=${BACKEND_PORT:8080}
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:adaptativa}
spring.datasource.username=${DB_USER:adaptativa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.db.enabled=true
# Actuator usa su propio mapeo CORS, con la misma lista de orígenes del API.
management.endpoints.web.cors.allowed-origins=${app.cors.allowed-origins}
management.endpoints.web.cors.allowed-methods=GET
management.endpoints.web.cors.allowed-headers=Accept
management.endpoints.web.cors.allow-credentials=false
